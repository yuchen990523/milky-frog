<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff3e7">
  <title>奶蛙蛋糕店</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <main class="game">
    <header class="game-header">
      <h1>🍰 奶蛙蛋糕店</h1>
      <p>照著客人的心願，做出今天最甜的蛋糕！</p>
    </header>

    <div class="game-layout">
      <section class="panel workshop" aria-label="蛋糕製作區">
      <div class="canvas-wrap">
        <!-- Canvas 負責繪製蛋糕與工作檯；畫布尺寸由 JavaScript 配合高解析度螢幕調整。 -->
        <canvas id="cakeCanvas" width="720" height="310" role="img" aria-label="目前製作中的蛋糕"></canvas>
      </div>

      <div class="controls" aria-label="蛋糕材料選擇">
        <div class="ingredient-stage">
        <p class="step-indicator" id="stepIndicator" aria-live="polite">第 1 步／3：選擇蛋糕體</p>
        <section class="ingredient-group" id="baseStep" role="group" aria-labelledby="baseChoicesTitle">
          <h3 id="baseChoicesTitle">① 🍰 蛋糕體</h3>
          <div class="ingredient-options" id="baseOptions"></div>
        </section>
        <section class="ingredient-group" id="creamStep" role="group" aria-labelledby="creamChoicesTitle" hidden>
          <h3 id="creamChoicesTitle">② 🥄 奶油口味</h3>
          <div class="ingredient-options" id="creamOptions"></div>
        </section>
        <section class="ingredient-group" id="toppingStep" role="group" aria-labelledby="toppingChoicesTitle" hidden>
          <h3 id="toppingChoicesTitle">③ 🍓 裝飾配料</h3>
          <div class="ingredient-options" id="toppingOptions"></div>
        </section>
        <p class="step-complete" id="stepComplete" hidden>🎉 蛋糕完成！可以交給客人了。</p>
        </div>
        <button class="back-button" id="backStepButton" type="button" disabled>← 上一步</button>
      </div>

      <div class="bottom-bar">
        <div class="game-status" aria-live="polite">
          <span
            title="評級：5 秒內 5 星、8 秒內 4 星、13 秒內 3 星、16 秒內 2 星、20 秒內 1 星；超過 20 秒為 0 星"
          >⏱ 製作時間：<span id="timerDisplay">0.0</span> 秒</span>
          <span id="timerRating" aria-label="目前計時星等">計時星等：☆☆☆☆☆</span>
        </div>
        <div class="actions">
          <button class="submit-button" id="submitButton" type="button">交給客人</button>
          <button class="clear-button" id="clearButton" type="button" aria-label="清空目前蛋糕">重做</button>
        </div>
      </div>
      <p id="message" role="status" aria-live="polite">第 1 步：先選擇蛋糕體。</p>
      </section>

      <div class="side-column">
        <section class="panel level-panel" aria-label="玩家等級">
          <div class="level-card">
          <div class="level-heading">
            <strong id="levelNumber">等級 1</strong>
            <span id="levelExperience">0 / 100 XP</span>
          </div>
          <div
            class="level-track"
            id="levelTrack"
            role="progressbar"
            aria-label="升級經驗值"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div class="level-progress" id="levelProgress"></div>
          </div>
          <p class="level-title" id="levelTitle">新手烘焙師</p>
          </div>
        </section>
        <section class="panel order-panel" aria-labelledby="orderHeading">
          <div class="order-copy">
            <p class="eyebrow">來店顧客・待製作訂單</p>
            <h2 id="orderHeading">訂單候客中</h2>
            <p id="orderText" aria-live="polite"></p>
          </div>
          <div class="order-list" id="orderList" role="list" aria-label="待製作訂單"></div>
        </section>
      </div>
    </div>
  </main>

  <dialog class="outcome-dialog" id="outcomeDialog" aria-labelledby="outcomeTitle">
    <h2 id="outcomeTitle"></h2>
    <div class="outcome-art">
      <img id="outcomeImage" alt="" hidden>
      <span class="outcome-placeholder" id="outcomePlaceholder" aria-hidden="true"></span>
    </div>
    <p class="outcome-detail" id="outcomeDetail"></p>
    <p class="outcome-stars" id="outcomeStars" aria-label="本次星等"></p>
    <p class="outcome-rewards" id="outcomeRewards"></p>
    <button class="outcome-close" id="outcomeClose" type="button">繼續製作</button>
  </dialog>

  <script src="./js/game.js" defer></script>
</body>
</html>
